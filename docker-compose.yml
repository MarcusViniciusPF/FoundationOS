name: foundation-os

services:
  foundationos-redis:
    image: redis:7-alpine
    container_name: foundationos-redis
    restart: unless-stopped
    volumes:
      - foundationos_redis_data:/data
    networks:
      - foundationos-network

  foundationos-bot:
    image: node:22-alpine
    container_name: foundationos-bot
    restart: unless-stopped
    env_file:
      - ./.env
    working_dir: /app
    volumes:
      - ./:/app
      - ./logs:/logs
      - ./backups:/backups
      - ./uploads:/uploads
    command: sh -c "while true; do sleep 3600; done"
    networks:
      - foundationos-network
      - postgres_default

volumes:
  foundationos_redis_data:

networks:
  foundationos-network:
    driver: bridge
  postgres_default:
    external: true
